name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: warka
          POSTGRES_PASSWORD: warka_ci
          POSTGRES_DB: warka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warka -d warka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://warka:warka_ci@localhost:5432/warka_test?schema=public
      TEST_DATABASE_URL: postgresql://warka:warka_ci@localhost:5432/warka_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:check
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:preflight
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm test:load:config
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
