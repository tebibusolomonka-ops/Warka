server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
