services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: warka
      POSTGRES_PASSWORD: warka_dev
      POSTGRES_DB: warka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warka -d warka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
